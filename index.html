<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Primeiro Emprego</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ANIMAÇÃO DE TRANSIÇÃO -->
    <div id="transicao"></div>


    <!-- TELA INICIAL -->
    <section id="tela-inicial">

        <div class="titulo-jogo">
            <img src="titulo.png" alt="Meu Primeiro Emprego">
        </div>

        <div class="menu-lateral">

            <button onclick="irParaIdentificacao()">
                <img src="botao-comecar.png" alt="Começar">
            </button>

            <button onclick="mostrarCreditos()">
                <img src="botao-creditos.png" alt="Créditos">
            </button>

        </div>

    </section>


    <!-- TELA DE IDENTIFICAÇÃO -->
    <section id="tela-identificacao">

        <img src="antes.png" width="400" alt="Identificação">

        <p>Como devemos chamar você?</p>

        <input
            type="text"
            id="nomeJogador"
            placeholder="Digite seu nome..."
            maxlength="20"
        >

        <button onclick="comecarJogo()">
            CONTINUAR
        </button>

    </section>


    <!-- TELA DE CRÉDITOS -->
    <section id="tela-creditos">

        <h1>Créditos</h1>

        <p>
            Desenvolvido por: <br>
            <strong>Anne e Sophia 3ºJ, nº 6 e 38.</strong>
        </p>

        <p>
            Todas as imagens foram retiradas do Pinterest.
            Os créditos vão para seus criadores originais.
            Nenhuma dessas imagens é autoral.
        </p>

        <button onclick="voltarParaMenu()">
            VOLTAR
        </button>

    </section>


    <!-- TELA DO JOGO -->
    <section id="tela-jogo">

        <div class="cenario">

            <h2>O começo de tudo...</h2>

            <div class="dialogo">

                <p id="texto">
                    Era uma manhã de segunda-feira...
                </p>

                <button onclick="proximaCena()">
                    CONTINUAR
                </button>

            </div>

        </div>

    </section>


    <!-- JAVASCRIPT -->
    <script src="./main.js"></script>

</body>
</html>

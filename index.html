<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiro Emprego</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="transicao"></div>

    <!-- MENU INICIAL -->
    <section id="tela-inicial">
        <div class="menu-conteudo">
            <img class="titulo-jogo" src="titulo.png" alt="Meu Primeiro Emprego">

            <div class="menu-botoes">
                <button onclick="irParaIdentificacao()">
                    <img src="botao-comecar.png" alt="Começar">
                </button>

                <button onclick="mostrarCreditos()">
                    <img src="botao-creditos.png" alt="Créditos">
                </button>
            </div>
        </div>
    </section>

    <!-- IDENTIFICAÇÃO -->
    <section id="tela-identificacao">
        <div class="identificacao-conteudo">
            <img src="antes.png" alt="Antes de começar" class="imagem-identificacao">
            <p>Como devemos chamar você?</p>

            <input
                type="text"
                id="nomeJogador"
                placeholder="Digite seu nome..."
                maxlength="20"
            >

            <button class="botao-principal" onclick="comecarJogo()">
                CONTINUAR
            </button>
        </div>
    </section>

    <!-- CRÉDITOS -->
    <section id="tela-creditos">
        <div class="creditos-conteudo">
            <h1>CRÉDITOS</h1>

            <p>Desenvolvido por:</p>
            <p><strong>Anne e Sophia — 3ºJ</strong></p>

            <p>
                As imagens utilizadas são de terceiros.
                Todos os créditos pertencem aos seus criadores originais.
            </p>

            <button class="botao-principal" onclick="voltarParaMenu()">
                VOLTAR
            </button>
        </div>
    </section>

    <!-- JOGO -->
    <section id="tela-jogo">

        <div class="cenario">

            <div id="fundoCena" class="cenario-fundo"></div>

            <div class="informacoes">
                <span id="numeroCena">DIA 01</span>
                <span id="localCena">AURORA COMUNICAÇÃO</span>
            </div>

            <div class="personagem-area">
    <div id="personagem" class="personagem">
        <span id="iconePersonagemTexto">✦</span>
        <img id="iconePersonagem" src="" alt="Personagem" style="display: none;">
    </div>
</div>

            <div class="dialogo">

                <h2 id="nomePersonagem">NARRADOR</h2>

                <p id="texto"></p>

                <div id="opcoes"></div>

                <button id="botaoContinuar" onclick="continuarHistoria()">
                    CONTINUAR
                </button>

            </div>

        </div>

    </section>

    <!-- GAME OVER -->
    <section id="tela-game-over">
        <div class="game-over-conteudo">

            <div class="game-over-icone">✕</div>

            <h1 class="game-over-titulo">GAME OVER</h1>

            <p class="game-over-subtitulo">DIA 01 — ENCERRADO</p>

            <p id="textoGameOver" class="game-over-texto">
                Sua escolha não foi a mais adequada...
            </p>

            <button class="botao-principal" onclick="reiniciarJogo()">
                TENTAR NOVAMENTE
            </button>

        </div>
    </section>

    <script src="main.js"></script>

</body>
</html>
